<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="yoloit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>yoloit</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Disable horizontal swipe navigation everywhere we can. */
    html, body {
      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
      touch-action: pan-y;
    }
    /* Prevent the horizontal-scroll-triggered browser back/forward gesture. */
    body {
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <script>
    // Neutralise the back/forward history swipe on macOS Safari / Chrome.
    // Push a dummy state so the user can not swipe-navigate backwards/forwards.
    history.pushState(null, document.title, location.href);
    window.addEventListener('popstate', function(event) {
      history.pushState(null, document.title, location.href);
    });

    // Force unregister old service worker and clear caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }

    // Block the browser back/forward swipe gesture (trackpad / Magic Mouse).
    (function() {
      function isHorizontalWheel(e) {
        if (e.deltaX != null && e.deltaX !== 0) {
          return Math.abs(e.deltaX) > Math.abs(e.deltaY || 0);
        }
        if (e.wheelDeltaX != null && e.wheelDeltaX !== 0) {
          return Math.abs(e.wheelDeltaX) > Math.abs(e.wheelDeltaY || 0);
        }
        return false;
      }
      function blockHorizontalWheel(e) {
        if (isHorizontalWheel(e)) e.preventDefault();
      }
      window.addEventListener('wheel', blockHorizontalWheel, { passive: false, capture: true });
      window.addEventListener('mousewheel', blockHorizontalWheel, { passive: false, capture: true });
      document.addEventListener('wheel', blockHorizontalWheel, { passive: false, capture: true });
      document.addEventListener('mousewheel', blockHorizontalWheel, { passive: false, capture: true });

      // Block mouse back/forward buttons (some trackpads/mice map to buttons 3/4).
      function blockHistoryMouseButton(e) {
        if (e.button === 3 || e.button === 4) {
          e.preventDefault();
          e.stopPropagation();
        }
      }
      window.addEventListener('mousedown', blockHistoryMouseButton, { capture: true });
      window.addEventListener('mouseup', blockHistoryMouseButton, { capture: true });

      // Block Alt/Option + Arrow and Cmd + [ / ] history navigation.
      window.addEventListener('keydown', function(e) {
        if (
          (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) ||
          ((e.metaKey || e.ctrlKey) && (e.key === '[' || e.key === ']'))
        ) {
          e.preventDefault();
        }
      }, { capture: true });

      // Also block horizontal two-finger touch swipes.
      let startX = 0;
      let startY = 0;
      window.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 2) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true, capture: true });
      window.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 2) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
