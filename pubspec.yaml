  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.7
  flutter_pty: ^0.4.2
  meta: any
  xterm:
    path: packages/xterm
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  path: ^1.9.1
  process_run: ^1.3.4
  diff_match_patch: ^0.4.1
  highlight: ^0.7.0
  re_highlight: ^0.0.1
  shared_preferences: ^2.5.3
  super_clipboard: ^0.9.1
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^10.3.1
  flutter_colorpicker: ^1.1.0
  flutter_code_editor:
    path: third_party/flutter_code_editor
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  yaml: ^3.1.2
  flutter_js: ^0.8.7
  dmtools_mermaid_renderer:
    path: packages/mermaid_renderer_flutter
  # ── Collaboration / remote sync ──────────────────────────────────────────
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1
  shelf_static: ^1.1.3
  crypto: ^3.0.0
  vector_math: any
  cryptography: ^2.9.0
  webview_flutter: ^4.14.0
  fl_chart: ^1.2.0
  pluto_grid: ^8.1.0
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  record: ^7.1.1
  js_widget_runtime: ^0.4.16
  local_models_sdk:
    path: third_party/flutter_local_models/packages/local_models_sdk
  local_models_flutter:
    path: third_party/flutter_local_models/packages/local_models_flutter

  xml: ^7.0.1
  path_provider: any
  flutter_highlight: any
  json_annotation: ^4.12.0
  http: ^1.3.0
  web: ^1.1.1
  flutter_cube: ^0.1.1
  flame: ^1.38.0
  flame_3d: ^0.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.2
  fake_async: ^1.3.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  json_serializable: ^6.14.0
  build_runner: ^2.15.0

dependency_overrides:
  volume_controller:
    path: third_party/volume_controller
  # Flutter SDK pins below pub latest — override to stay current.
  meta: ^1.18.3
  vector_math: ^2.4.0
  test: ^1.31.2
  test_api: ^0.7.13
  test_core: ^0.6.19
  matcher: ^0.12.20
  flutter_secure_storage_darwin: ^0.4.0
  package_config: ^3.0.0
  _fe_analyzer_shared: ^104.0.0
  analyzer: ^14.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/models/
    - assets/prompts/
    - assets/config/
    - assets/command_catalog/
    - tools/yoloit
    - tools/yoloitd/yoloitd
    - tools/widgets/weather/manifest.json
    - tools/widgets/weather/widget.js
    - tools/widgets/crypto/manifest.json
    - tools/widgets/crypto/widget.js
    - tools/widgets/stocks/manifest.json
    - tools/widgets/stocks/widget.js
    - tools/widgets/calculator/manifest.json
