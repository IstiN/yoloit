    - yoloit/templates/habit_tracker/template.yaml
    - yoloit/templates/home_notes/template.yaml
    - yoloit/templates/impact_effort_matrix/template.yaml
    - yoloit/templates/okr_planning/template.yaml
    - yoloit/templates/personal_expenses/template.yaml
    - yoloit/templates/product_roadmap/template.yaml
    - yoloit/templates/retrospective/template.yaml
    - yoloit/templates/sales_dashboard/template.yaml
    - yoloit/templates/sprint_planning/template.yaml
    - yoloit/templates/trip_planner/template.yaml
    - yoloit/templates/user_story_map/template.yaml
    - yoloit/templates/weekly_review/template.yaml

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

