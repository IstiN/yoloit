name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - 'web/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy_demo.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone flutter_code_editor
        run: |
          rm -rf third_party/flutter_code_editor
          git clone --branch v0.3.5 --depth=1 \
            https://github.com/akvelon/flutter-code-editor.git \
            third_party/flutter_code_editor
          git -C third_party/flutter_code_editor log -1 --oneline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib web

      - name: Build Flutter demo
        run: |
          BASE_HREF="/${{ github.event.repository.name }}/app/"
          flutter build web --release --target lib/main_web_full.dart --base-href "$BASE_HREF" --pwa-strategy none

      - name: Cache-bust generated web assets
        run: |
          CACHE_TAG="${{ github.run_id }}"
          sed -i "s|flutter_bootstrap\.js?v=[^\"']*|flutter_bootstrap.js?v=${CACHE_TAG}|g" build/web/index.html
          sed -i 's|flutter_bootstrap\.js\"|flutter_bootstrap.js?v='"${CACHE_TAG}"'\"|g' build/web/index.html
          sed -i "s|main\.dart\.js|main.dart.js?v=${CACHE_TAG}|g" build/web/flutter_bootstrap.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/app
          cp -r site/* _site/
          cp -r build/web/* _site/app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 120000
