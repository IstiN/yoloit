name: Update CRAP badge

on:
  push:
    branches: [main]
    paths-ignore:
      - 'badges/**'
      - '.github/workflows/crap-badge.yml'

concurrency:
  group: crap-badge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-badge:
    name: Regenerate and commit CRAP badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone flutter_code_editor
        run: |
          rm -rf third_party/flutter_code_editor
          git clone --branch v0.3.5 --depth=1 \
            https://github.com/akvelon/flutter-code-editor.git \
            third_party/flutter_code_editor
          git -C third_party/flutter_code_editor log -1 --oneline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate coverage
        # Golden tests are environment-sensitive (pixel diffs on machines whose
        # rendering differs from where the goldens were generated). The badge
        # must regenerate regardless; the real test signal lives in other jobs.
        continue-on-error: true
        run: flutter test --coverage

      - name: Install crap4dart
        run: |
          dart pub global activate crap4dart
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Regenerate CRAP badge
        run: crap4dart analyze --badge badges/crap.svg || true

      - name: Commit and push badge
        run: |
          if git diff --quiet -- badges/crap.svg; then
            echo 'CRAP badge is unchanged; skipping commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add badges/crap.svg
          git commit -m 'chore(badge): update CRAP score [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
