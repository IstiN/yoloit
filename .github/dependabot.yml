# Dependabot keeps Dart/Flutter deps and GitHub Actions up to date.
# SDK gates (Dart 3.10.8 today): record >=7 needs 3.12, xml >=7 needs 3.11,
# json_serializable >=6.13 needs analyzer 10+ (conflicts with flutter_test).
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: record
        update-types: [version-update:semver-major]
      - dependency-name: xml
        update-types: [version-update:semver-major]
      - dependency-name: json_annotation
        update-types: [version-update:semver-major]
      - dependency-name: json_serializable
        update-types: [version-update:semver-major]
    groups:
      flutter-runtime:
        patterns:
          - 'flutter_*'
          - 'bloc'
          - 'equatable'
          - 'meta'
          - 'path'
          - 'yaml'
          - 'crypto'
          - 'shelf*'
          - 'webview_flutter'
      flutter-media:
        patterns:
          - 'media_kit*'
          - 'record'
          - 'volume_controller'
      flutter-dev:
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
