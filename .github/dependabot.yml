# Dependabot keeps Dart/Flutter deps and GitHub Actions up to date.
# Requires Dart >=3.12 (Flutter 3.44.4+) for record 7, xml 7, json_serializable 6.14+.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      flutter-runtime:
        patterns:
          - 'flutter_*'
          - 'bloc'
          - 'equatable'
          - 'meta'
          - 'path'
          - 'yaml'
          - 'crypto'
          - 'shelf*'
          - 'webview_flutter'
      flutter-media:
        patterns:
          - 'media_kit*'
          - 'record'
          - 'volume_controller'
      flutter-dev:
        dependency-type: development
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
