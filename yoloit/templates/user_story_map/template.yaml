id: user-story-map
name: User Story Map
icon: story
description: |
  Miro-style user story map with persona note, journey-step kanban, story stickies, and acceptance checklist.

parameters:
  - name: persona
    type: string
    label: Persona
    description: Main user persona for the story map
    required: true
    default: Primary User

  - name: goal
    type: string
    label: Goal
    description: The top-level user goal
    required: true
    default: complete a key task

operations:
  - op: panel.create
    type: board.note.markdown
    title: "Persona & Goal"
    x: 40
    y: 40
    width: 420
    height: 260
    state:
      markdown: |
        # {{persona}}

        **Goal:** {{goal}}

        ## Pain points
        -

        ## Success looks like
        -

  - op: panel.create
    type: board.kanban
    title: "User Activities"
    x: 490
    y: 40
    width: 900
    height: 420
    state:
      columns: [Discover, Sign up, Use, Share]
      cards:
        - title: Find the product
          column: Discover
        - title: Create an account
          column: Sign up
        - title: Complete core action
          column: Use
        - title: Invite a teammate
          column: Share

  - op: panel.create
    type: board.sticky
    title: "Story A"
    x: 40
    y: 330
    width: 220
    height: 160
    state:
      text: "As a {{persona}}, I want ... so that ..."
      color: "#BFDBFE"

  - op: panel.create
    type: board.sticky
    title: "Story B"
    x: 280
    y: 330
    width: 220
    height: 160
    state:
      text: "As a {{persona}}, I want ... so that ..."
      color: "#FEF08A"

  - op: panel.create
    type: board.checklist
    title: "Acceptance Criteria"
    x: 40
    y: 520
    width: 460
    height: 260
    state:
      items:
        - id: ac1
          text: Scenario given-when-then is defined
          done: false
        - id: ac2
          text: Edge cases are covered
          done: false
        - id: ac3
          text: UX copy is approved
          done: false

  - op: board.fit
