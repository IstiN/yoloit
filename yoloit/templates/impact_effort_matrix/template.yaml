id: impact-effort-matrix
name: Impact / Effort Matrix
icon: matrix
description: |
  Miro-style impact/effort prioritization matrix with quadrant stickies and a next-steps checklist.

parameters:
  - name: topic
    type: string
    label: Topic
    description: What are you prioritizing?
    required: true
    default: Initiatives

operations:
  - op: panel.create
    type: board.note.markdown
    title: "{{topic}} Prioritization"
    x: 40
    y: 40
    width: 420
    height: 260
    state:
      markdown: |
        # {{topic}}

        ## Goal
        Decide what to do first.

        ## Axes
        - **Vertical:** Impact (low → high)
        - **Horizontal:** Effort (low → high)

  - op: panel.create
    type: board.sticky
    title: "Quick Wins"
    x: 490
    y: 40
    width: 260
    height: 200
    state:
      text: "High impact, low effort\n\n-"
      color: "#86EFAC"

  - op: panel.create
    type: board.sticky
    title: "Big Bets"
    x: 780
    y: 40
    width: 260
    height: 200
    state:
      text: "High impact, high effort\n\n-"
      color: "#93C5FD"

  - op: panel.create
    type: board.sticky
    title: "Fill-ins"
    x: 490
    y: 270
    width: 260
    height: 200
    state:
      text: "Low impact, low effort\n\n-"
      color: "#FEF08A"

  - op: panel.create
    type: board.sticky
    title: "Thankless"
    x: 780
    y: 270
    width: 260
    height: 200
    state:
      text: "Low impact, high effort\n\n-"
      color: "#FCA5A5"

  - op: panel.create
    type: board.shape
    title: ""
    x: 1070
    y: 40
    width: 160
    height: 430
    state:
      shape: rectangle
      fillColor: "#00000000"
      strokeColor: "#94A3B8"
      strokeWidth: 2
      text: "Impact ↑"
      fontSize: 18
      textColor: "#64748B"

  - op: panel.create
    type: board.shape
    title: ""
    x: 490
    y: 500
    width: 550
    height: 100
    state:
      shape: rectangle
      fillColor: "#00000000"
      strokeColor: "#94A3B8"
      strokeWidth: 2
      text: "Effort →"
      fontSize: 18
      textColor: "#64748B"

  - op: panel.create
    type: board.checklist
    title: "Next Steps"
    x: 40
    y: 330
    width: 420
    height: 260
    state:
      items:
        - id: n1
          text: Pick 3 quick wins
          done: false
        - id: n2
          text: Validate big bets
          done: false
        - id: n3
          text: Defer or drop thankless tasks
          done: false

  - op: board.fit
